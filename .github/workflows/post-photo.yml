name: Кейс Агентство недвижимости (фото + кнопка)

on:
  workflow_dispatch:

jobs:
  send-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка фото
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          TOKEN = os.environ["RAW_TOKEN"].strip()
          CHAT_ID = os.environ["RAW_CHAT_ID"].strip()
          BASE = f"https://api.telegram.org/bot{TOKEN}"

          photo_url = "https://litter.catbox.moe/5ssl94.jpeg"

          caption = (
              '<b>Агентство недвижимости</b> <tg-emoji emoji-id="5235630047959727475">💎</tg-emoji>\n'
              '\n'
              '<tg-emoji emoji-id="5411520005386806155">🏁</tg-emoji> <b>Задача:</b>\n'
              'Повысить узнаваемость агентства среди потенциальных клиентов.\n'
              'Привести горячие заявки.\n'
              '\n'
              '<tg-emoji emoji-id="5213306719215577669">🧩</tg-emoji> <b>Что сделано:</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Исследована реклама конкурентов. Лид-магнит согласован с клиентом\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Созданы рекламные креативы с рекламой объектов, размещённых в каталоге\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Рекламные кампании запущены на лид-формы с возможностью скачивания каталога объектов\n'
              '\n'
              '<tg-emoji emoji-id="5350460637182993292">🎯</tg-emoji> <b>Результат:</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>1 124</b> заявки по <b>2$</b> за лид\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Охват — <b>105 704</b> чел., кликов — <b>>12 000</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Потрачено <b>>2 200$</b>, стоимость клика <b>0,16$</b>\n'
              '\n'
              '<tg-emoji emoji-id="5427009714745517609">✅</tg-emoji> Скрин статистики <tg-emoji emoji-id="5470177992950946662">👇</tg-emoji>\n'
              '\n'
              '<blockquote><tg-emoji emoji-id="5471883477219549006">💪</tg-emoji> Больше 1000 лидов по 2$ — отличный результат для рынка недвижимости. Кампания окупается, бренд знают.</blockquote>\n'
              '\n'
              '#Таргет #КейсАгентство #Лиды'
          )

          keyboard = {
              "inline_keyboard": [
                  [{
                      "text": "Подробнее🚀",
                      "url": "https://t.me/Keis_Market_bot"
                  }]
              ]
          }

          payload = {
              "chat_id": CHAT_ID,
              "photo": photo_url,
              "caption": caption,
              "parse_mode": "HTML",
              "reply_markup": keyboard
          }

          req = urllib.request.Request(
              f"{BASE}/sendPhoto",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"Ошибка API Telegram: {e.code} {e.reason}")
              print("Ответ:", error_body)
              sys.exit(1)

          if not result.get("ok"):
              print("Ошибка отправки:", result)
              sys.exit(1)

          msg_id = result["result"]["message_id"]
          print("✅ Фото отправлено, id:", msg_id)
          PYEOF
