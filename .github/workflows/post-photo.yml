name: Кейс Агентство недвижимости 2 (фото + кнопка)

on:
  workflow_dispatch:

jobs:
  send-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка фото
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          TOKEN = os.environ["RAW_TOKEN"].strip()
          CHAT_ID = os.environ["RAW_CHAT_ID"].strip()
          BASE = f"https://api.telegram.org/bot{TOKEN}"

          photo_url = "https://litter.catbox.moe/lb46dk.jpeg"

          caption = (
              '<b>Агентство недвижимости</b> <tg-emoji emoji-id="5235630047959727475">💎</tg-emoji>\n'
              '\n'
              '<tg-emoji emoji-id="5411520005386806155">🏁</tg-emoji> <b>На старте:</b>\n'
              'Проблема — нет заявок на покупку недвижимости.\n'
              'Цели: повысить узнаваемость бренда, принести заявки.\n'
              '\n'
              '<tg-emoji emoji-id="5350460637182993292">🎯</tg-emoji> <b>По окончании:</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>1 590</b> переходов на сайт по <b>0,06$</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>564</b> лида на сайте\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>124</b> записавшихся и пришедших на показ объектов\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> Период рекламы: <b>1 месяц</b>\n'
              '\n'
              '<tg-emoji emoji-id="5427009714745517609">✅</tg-emoji> Скрин статистики <tg-emoji emoji-id="5470177992950946662">👇</tg-emoji>\n'
              '\n'
              '<blockquote><tg-emoji emoji-id="5471883477219549006">💪</tg-emoji> Переходы по 6 центов и 124 реальных показа за месяц — реклама отработала мощно.</blockquote>\n'
              '\n'
              '#ТаргетВК #КейсНедвижимость #Лиды'
          )

          keyboard = {
              "inline_keyboard": [
                  [{
                      "text": "💪 Хочу такие же лиды",
                      "url": "https://t.me/Keis_Marketing_bot?start=price"
                  }]
              ]
          }

          payload = {
              "chat_id": CHAT_ID,
              "photo": photo_url,
              "caption": caption,
              "parse_mode": "HTML",
              "reply_markup": keyboard
          }

          req = urllib.request.Request(
              f"{BASE}/sendPhoto",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"Ошибка API Telegram: {e.code} {e.reason}")
              print("Ответ:", error_body)
              sys.exit(1)

          if not result.get("ok"):
              print("Ошибка отправки:", result)
              sys.exit(1)

          msg_id = result["result"]["message_id"]
          print("✅ Фото отправлено, id:", msg_id)
          PYEOF
