name: Кейс Сайт (фото + кнопка)

on:
  workflow_dispatch:

jobs:
  send-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка фото
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          TOKEN = os.environ["RAW_TOKEN"].strip()
          CHAT_ID = os.environ["RAW_CHAT_ID"].strip()
          BASE = f"https://api.telegram.org/bot{TOKEN}"

          photo_url = "https://litter.catbox.moe/o6ppvz.jpeg"

          caption = (
              '<b>Пример Сайта</b> <tg-emoji emoji-id="5235630047959727475">💎</tg-emoji>\n'
              '\n'
             
            
            ВебДизайн #КейсСайт'
          )

          keyboard = {
              "inline_keyboard": [
                  
                      "text": "Хочу такой же сайт💪",
                      "url": "https://t.me/Keis_Marketing_bot?start=price"
                  }]
              ]
          }

          payload = {
              "chat_id": CHAT_ID,
              "photo": photo_url,
              "caption": caption,
              "parse_mode": "HTML",
              "reply_markup": keyboard
          }

          req = urllib.request.Request(
              f"{BASE}/sendPhoto",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"Ошибка API Telegram: {e.code} {e.reason}")
              print("Ответ:", error_body)
              sys.exit(1)

          if not result.get("ok"):
              print("Ошибка отправки:", result)
              sys.exit(1)

          msg_id = result["result"]["message_id"]
          print("✅ Фото отправлено, id:", msg_id)
          PYEOF
