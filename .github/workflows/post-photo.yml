                      if post["type"] == "text":
                          result = send_message(chat, post["text"], post["keyboard"])
                      else:
                          result = send_photo(chat, post["photo_url"], post["caption"], post["keyboard"])
                      if result.get("ok"):
                          print(f"  ✅ Пост {i} отправлен, id={result['result']['message_id']}")
                      else:
                          print(f"  ❌ Ошибка в посте {i}: {result}")
                  except Exception as e:
                      print(f"  ❌ Исключение в посте {i}: {e}")
                  time.sleep(4)
              time.sleep(2)
          print("\n🎉 Все группы обработаны!")
          PYEOF
