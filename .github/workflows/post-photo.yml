name: Кейс Логистика (фото + кнопка)

on:
  workflow_dispatch:

jobs:
  send-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка фото
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          TOKEN = os.environ["RAW_TOKEN"].strip()
          CHAT_ID = os.environ["RAW_CHAT_ID"].strip()
          BASE = f"https://api.telegram.org/bot{TOKEN}"

          photo_url = "https://litter.catbox.moe/ae5snp.jpeg"

          caption = (
              '<b>Реклама полного спектра услуг по выкупу и доставке товаров из Китая</b> <tg-emoji emoji-id="5431449001532594346">⚡️</tg-emoji>\n'
              '\n'
              '<tg-emoji emoji-id="5411520005386806155">🏁</tg-emoji> <b>Было:</b>\n'
              'Профиль в Инстаграм с небольшим числом подписчиков.\n'
              'Цель: получать от 5 лидов в день за <b>20$</b>.\n'
              '\n'
              '<tg-emoji emoji-id="5244837092042750681">📈</tg-emoji> <b>Сейчас:</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>4 500</b> подписчиков\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>68</b> целевых лидов за последние 7 дней\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>1,65$</b> за лид\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>0,45$</b> за переход\n'
              '\n'
              '<tg-emoji emoji-id="5445284980978621387">🚀</tg-emoji> <b>В планах:</b>\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>10 000</b> подписчиков\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>100</b> целевых лидов в неделю\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> <b>1,00$</b> за лид и <b>0,20$</b> за переход\n'
              '\n'
              '<tg-emoji emoji-id="5427009714745517609">✅</tg-emoji> Скрин статистики <tg-emoji emoji-id="5470177992950946662">👇</tg-emoji>\n'
              '\n'
              '<blockquote><tg-emoji emoji-id="5420315771991497307">🔥</tg-emoji> Снизили стоимость лида в <b>12 раз</b>. Лиды по 1,65$ при плане 20$ — это реальность. Можно масштабировать в любой нише услуг.</blockquote>\n'
              '\n'
              '<tg-emoji emoji-id="5350460637182993292">🎯</tg-emoji> <b>Хочешь так же?</b> Пиши, запустим под твой проект.\n'
              '\n'
              '#ТаргетИнст #Кейс #ДоставкаИзКитая #Логистика'
          )

          keyboard = {
              "inline_keyboard": [
                  [{
                      "text": "Хочу также 👆",
                      "url": "https://t.me/Keis_Market_bot"
                  }]
              ]
          }

          payload = {
              "chat_id": CHAT_ID,
              "photo": photo_url,
              "caption": caption,
              "parse_mode": "HTML",
              "reply_markup": keyboard
          }

          req = urllib.request.Request(
              f"{BASE}/sendPhoto",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"Ошибка API Telegram: {e.code} {e.reason}")
              print("Ответ:", error_body)
              sys.exit(1)

          if not result.get("ok"):
              print("Ошибка отправки:", result)
              sys.exit(1)

          msg_id = result["result"]["message_id"]
          print("✅ Фото отправлено, id:", msg_id)
          PYEOF
