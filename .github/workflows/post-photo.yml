name: Кейс Логистика (фото + кнопка)

on:
  workflow_dispatch:

jobs:
  send-photo-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка фото и закрепление
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          TOKEN = os.environ["RAW_TOKEN"].strip()
          CHAT_ID = os.environ["RAW_CHAT_ID"].strip()
          BASE = f"https://api.telegram.org/bot{TOKEN}"

          photo_url = "https://litter.catbox.moe/ae5snp.jpeg"

          caption = (
              'Реклама полного спектра услуг по выкупу и доставке товаров из Китая.\n'
              '\n'
              '<tg-emoji emoji-id="5411520005386806155">🏁</tg-emoji> Было:\n'
              'Профиль в Инстаграм с небольшим числом подписчиков.\n'
              'Цель: получать от 5 лидов в день за 20$.\n'
              '\n'
              '<tg-emoji emoji-id="5244837092042750681">📈</tg-emoji> Сейчас:\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 4 500 подписчиков\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 68 целевых лидов за последние 7 дней\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 1,65$ за лид\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 0,45$ за переход\n'
              '\n'
              '<tg-emoji emoji-id="5445284980978621387">🚀</tg-emoji> В планах:\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 10 000 подписчиков\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 100 целевых лидов в неделю\n'
              '<tg-emoji emoji-id="5357471466919056181">🔘</tg-emoji> 1,00$ за лид и 0,20$ за переход\n'
              '\n'
              '<tg-emoji emoji-id="5427009714745517609">✅</tg-emoji> Скрин статистики (см. вложение)\n'
              '\n'
              '#ТаргетИнст #КейсЛогистика'
          )

          keyboard = {
              "inline_keyboard": [
                  [{
                      "text": "Хочу также 👆",
                      "url": "https://t.me/Keis_Marketing_bot?start=price"
                  }]
              ]
          }

          payload = {
              "chat_id": CHAT_ID,
              "photo": photo_url,
              "caption": caption,
              "parse_mode": "HTML",
              "reply_markup": keyboard
          }

          req = urllib.request.Request(
              f"{BASE}/sendPhoto",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"Ошибка API Telegram: {e.code} {e.reason}")
              print("Ответ:", error_body)
              sys.exit(1)

          if not result.get("ok"):
              print("Ошибка отправки:", result)
              sys.exit(1)

          msg_id = result["result"]["message_id"]
          print("✅ Фото отправлено, id:", msg_id)

          pin_payload = {
              "chat_id": CHAT_ID,
              "message_id": msg_id,
              "disable_notification": False
          }
          req = urllib.request.Request(
              f"{BASE}/pinChatMessage",
              data=json.dumps(pin_payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req) as resp:
              pin_res = json.loads(resp.read().decode())
              if pin_res.get("ok"):
                  print("📌 Сообщение закреплено!")
              else:
                  print("Ошибка закрепления:", pin_res)
                  sys.exit(1)
          PYEOF
