[project]
name = "tiktok-publisher"
version = "0.1.0"
description = "Local TikTok auto-publisher via Dolphin Anty profiles (orchestrator + web dashboard)"
readme = "README.ru.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dolphin = ["pyanty[patchright]>=1.5.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
tiktok-publisher = "tiktok_publisher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_publisher"]

[tool.hatch.build.targets.wheel.force-include]
"src/tiktok_publisher/static" = "tiktok_publisher/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
