dry_run: false

dolphin:
  api_base: "http://127.0.0.1:3001"
  api_token: null

orchestrator:
  mode: sequential
  max_concurrent_profiles: 1
  # safe | normal | fast — фиксированные паузы; custom — использовать delay_* ниже
  speed_preset: normal
  delay_between_posts_sec:
    min: 45
    max: 120
  delay_after_error_sec: 300
  count_errors_toward_limit: true
  count_infra_errors_toward_limit: false
  skip_failed_file: true
  skip_duplicate_counts_toward_limit: false
  dolphin_min_start_interval_sec: 1.0
  posting_window: null
  posting_window_mode: reject
  timezone: "Europe/Moscow"
  report_flush_every_n: 5
  circuit_breaker_consecutive_errors: 0
  min_video_bytes: 1024
  max_caption_length: 2200
  require_preflight: true
  on_success: move_to_posted  # единственный режим v1 (вариант A)

queue:
  sort_by: mtime
  extensions:
    - ".mp4"
    - ".mov"

server:
  host: "127.0.0.1"
  port: 8765

paths:
  content_root: "./content"
  data_dir: "./data"

excel:
  registry_path: "./config/accounts.xlsx"
  sheet_accounts: "Аккаунты"
  caption_delimiter: "|||"

logging:
  log_dir: "./logs"
