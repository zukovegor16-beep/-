login_url: "https://www.tiktok.com/login"
password_settings_url: "https://www.tiktok.com/setting/password"
profile_edit_url: "https://www.tiktok.com/setting/profile"

# Optional: switch to email/phone login on TikTok
login_use_email_tab: "//a[contains(@href,'email') or contains(., 'Email') or contains(., 'phone')]"

login_username: "//input[@name='username']"
login_email: "//input[@type='text' and (@name='username' or contains(@placeholder,'Email'))]"
login_password: "//input[@type='password']"
login_submit: "//button[@type='submit']"
login_otp_code: "//input[contains(@placeholder,'code') or contains(@placeholder,'Code') or @name='code']"
login_otp_submit: "//button[contains(., 'Next') or contains(., 'Verify') or contains(., 'Submit')]"

password_current: "//input[@placeholder='Current password' or @autocomplete='current-password']"
password_new: "//input[@placeholder='New password' or @autocomplete='new-password']"
password_confirm: "//input[@placeholder='Confirm password']"
password_save: "//button[contains(., 'Save') or contains(., 'Сохранить')]"
password_verify_code: "//input[contains(@placeholder,'code') or contains(@placeholder,'Code') or @autocomplete='one-time-code']"
password_verify_submit: "//button[contains(., 'Next') or contains(., 'Verify') or contains(., 'Submit') or contains(., 'Confirm')]"

avatar_file_input: "//input[@type='file' and contains(@accept,'image')]"

timeouts:
  navigation_ms: 60000
  action_ms: 30000
